# Global Resilience Orchestrator Configuration
# Safety settings for the control plane
panic_threshold: 0.6
check_interval: "10s"
evaluation_interval: "15s"

# Infrastructure Topology
regions:
  - id: "azure-us-east"
    provider: "Azure"
    latency_ms: 42
    current_load: 0.45
  - id: "azure-us-west"
    provider: "Azure"
    latency_ms: 85
    current_load: 0.25
  - id: "aws-eu-central"
    provider: "AWS"
    latency_ms: 150
    current_load: 0.10